name: Check

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-security:
    name: Hosted .NET source/security gate (not Unity runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.402"

      - name: Run hosted security and integrity checks
        run: sh Tools~/ci-security.sh
